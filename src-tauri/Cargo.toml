[package]
name = "callnotes"
version = "0.3.16"
edition = "2021"
license = "GPL-3.0-only"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "protocol-asset"] }
png = "0.17"
base64 = "0.23"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
hound = "3.5"
which = "7"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "system-proxy"] }
tokio = { version = "1", features = ["time"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
keyring = { version = "=3.6.3", features = ["windows-native", "apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Devices_FunctionDiscovery", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_Registry", "Foundation", "Data_Xml_Dom", "UI_Notifications"] }
